 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <h1>المهمة 01 - آلة حاسبة تفاعلية</h1>
        <p>الأسبوع 08 - أساسيات JavaScript</p>
    </header>

    <main class="container">

        <div class="calculator">

            <h3>JAVASCRIPT آلة حاسبة بلغة</h3>

            <div class="display">

                <div class="expression" id="expression"></div>

                <div class="result" id="display">0</div>

            </div>

            <div class="buttons">

                <button class="clear" onclick="clearDisplay()">C</button>
                <button class="clear" onclick="deleteLast()">⌫</button>
                <button class="operator" onclick="percentage()">%</button>
                <button class="operator" onclick="chooseOperator('/')">÷</button>

                <button onclick="inputDigit('7')">7</button>
                <button onclick="inputDigit('8')">8</button>
                <button onclick="inputDigit('9')">9</button>
                <button class="operator" onclick="chooseOperator('*')">×</button>

                <button onclick="inputDigit('4')">4</button>
                <button onclick="inputDigit('5')">5</button>
                <button onclick="inputDigit('6')">6</button>
                <button class="operator" onclick="chooseOperator('-')">−</button>

                <button onclick="inputDigit('1')">1</button>
                <button onclick="inputDigit('2')">2</button>
                <button onclick="inputDigit('3')">3</button>
                <button class="operator" onclick="chooseOperator('+')">+</button>

                <button class="zero" onclick="inputDigit('0')">0</button>
                <button onclick="inputDecimal()">.</button>

                <button class="equal" onclick="calculate()">=</button>

            </div>

        </div>

        <div class="instructions">

            <h3>اختصارات لوحة المفاتيح</h3>

            <p>
                استخدم 0-9 لإدخال الأرقام،
                و + - * / للعمليات الحسابية،
                Enter أو = لحساب النتيجة،
                Escape للمسح،
                و Backspace لحذف آخر رقم.
            </p>

        </div>

    </main>

    <footer>
        جامعة الأقصى - تصميم وإدارة مواقع الإنترنت 1
    </footer>

    <script src="script.js"></script>

</body>
</html>
